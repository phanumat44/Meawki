<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7AB5E"/>
      <stop offset="1" stop-color="#E8843A"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F28C9A"/>
      <stop offset="1" stop-color="#F7B6AE"/>
    </linearGradient>
  </defs>
  <!-- ears, corners rounded by a same-colour stroke -->
  <g fill="url(#fur)" stroke="#F4A257" stroke-width="18" stroke-linejoin="round">
    <path d="M44 120 L56 30 L118 78 Z"/>
    <path d="M212 120 L200 30 L138 78 Z"/>
  </g>
  <g fill="url(#ear)">
    <path d="M62 102 L68 56 L102 82 Z"/>
    <path d="M194 102 L188 56 L154 82 Z"/>
  </g>
  <!-- head -->
  <ellipse cx="128" cy="148" rx="104" ry="86" fill="url(#fur)"/>
  <!-- forehead stripes -->
  <g stroke="#D9732C" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M128 70 V96"/>
    <path d="M104 74 L108 96"/>
    <path d="M152 74 L148 96"/>
  </g>
  <!-- muzzle -->
  <ellipse cx="128" cy="186" rx="46" ry="32" fill="#FFF1E0"/>
  <!-- eyes -->
  <g fill="#3B2A20">
    <ellipse cx="86" cy="146" rx="15" ry="20"/>
    <ellipse cx="170" cy="146" rx="15" ry="20"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="91" cy="138" r="5.5"/>
    <circle cx="175" cy="138" r="5.5"/>
  </g>
  <!-- nose and mouth -->
  <path d="M116 170 H140 Q141 172 139 175 L130 183 Q128 185 126 183 L117 175 Q115 172 116 170 Z" fill="#EC7A8C"/>
  <path d="M128 184 Q126 196 114 196 M128 184 Q130 196 142 196" fill="none" stroke="#3B2A20" stroke-width="5" stroke-linecap="round"/>
  <!-- blush -->
  <g fill="#FF8A9B" opacity="0.35">
    <ellipse cx="62" cy="182" rx="15" ry="9"/>
    <ellipse cx="194" cy="182" rx="15" ry="9"/>
  </g>
</svg>
